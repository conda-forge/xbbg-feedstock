conda_forge_output_validation: true
bot:
  version_updates:
    sources:
      - pypi
github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  pkg_format: '2'
provider:
  linux_64: github_actions
  osx_arm64: github_actions
  win_64: github_actions
# Temporary: on win-64, libmambapy 2.10.0 rejects the `signatures` argument that
# conda-libmamba-solver 26.10.0 passes, so every Windows build fails before the
# recipe runs (conda-forge/conda-libmamba-solver-feedstock#63). The first two
# entries are conda-smithy's defaults; drop this key once that issue is fixed.
# Temporary: anaconda-client 1.16.0 rejects `--channel` with `--user`, so
# linux-64 uploads fail (conda-forge/conda-forge-ci-setup-feedstock#454). It is
# marked broken upstream, but the CDN still serves it; drop the pin once it stops.
remote_ci_setup:
  - conda-forge-ci-setup=4
  - conda-build>=26.3
  - libmambapy<2.10
  - anaconda-client<1.16
